# Test-only configuration: JPA mapping is verified against in-memory H2 instead of Postgres,
# so these tests don't require a running database. Flyway (Postgres-specific SQL) is disabled;
# Hibernate generates the schema from the entities directly for this purpose.
spring.datasource.url=jdbc:h2:mem:gaebeditor;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
