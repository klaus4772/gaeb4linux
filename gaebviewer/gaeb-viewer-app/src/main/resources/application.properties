server.port=8080
spring.main.banner-mode=console
spring.profiles.default=embedded-db

# Spring Boot config
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Default database mode for the GAEB editor is the embedded PostgreSQL profile.
# To use an external PostgreSQL instance instead, start with:
#   --spring.profiles.active=external-db
# or set SPRING_PROFILES_ACTIVE=external-db.
# External DB credentials can be supplied via:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# The concrete datasource settings live in the profile-specific property files.

# Flyway owns the schema; Hibernate only ever validates that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration