# Local persistent SQLite database. The default file is created in the working directory.
# Override with GAEB_SQLITE_URL, for example jdbc:sqlite:/var/lib/gaebviewer/gaebviewer.db.
spring.datasource.url=${GAEB_SQLITE_URL:jdbc:sqlite:./gaebviewer.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
