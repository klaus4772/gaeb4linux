# External PostgreSQL profile.
# Use this when you want to connect to a separately managed database installation.
# Example:
#   java -jar gaebviewer.jar --spring.profiles.active=external-db
# or set SPRING_PROFILES_ACTIVE=external-db

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gaebeditor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:gaebeditor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:gaebeditor}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
